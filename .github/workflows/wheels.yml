name: Wheels

# Builds one release wheel per platform from the pinned native core (the
# same stage ci.yml proves on every push), replays the repository fixtures
# against the installed wheel, and uploads it as a workflow artifact.
# Publishing to PyPI is the separate, owner-gated publish.yml.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/wheels.yml'
      - '.github/workflows/publish.yml'

permissions:
  contents: read

jobs:
  native:
    name: Native stage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Reuse only the matching native source and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/src
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            .native-src/target
            .native-src/rust
            .native-src/framework
          key: mml-native-${{ runner.os }}-${{ runner.arch }}-rust195-${{ hashFiles('ci/native-source.json', 'build_native.py') }}
      - name: Verify native notice provenance helpers
        run: python -m unittest discover -s tests -p test_build_native.py -v
      - name: Build the pinned public native library once
        run: python scripts/ci.py build-native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          include-hidden-files: true
          path: .native/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: .ci-evidence/*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
  installed:
    name: Release wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: .native
      - name: Build the wheel and install it in a fresh environment
        run: python scripts/ci.py install-wheel
      - name: Test every repository fixture against the installed wheel
        run: python scripts/ci.py test-installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          include-hidden-files: true
          path: .ci-evidence/*
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/mml-*.whl
          if-no-files-found: error
