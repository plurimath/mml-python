[package]
name = "lutaml-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Portable LML contracts and Rust generation interfaces"
license = "BSD-2-Clause"
repository = "https://github.com/lutaml/lutaml-rs"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "lutaml-rs"
path = "src/main.rs"
required-features = ["generator"]

[features]
default = ["generator"]
# Host-only loading, canonical identity, and artifact production.
generator = ["dep:serde_yaml", "dep:sha2", "dep:unsafe-libyaml"]
# Generated consumers need only the shared data and exact-number contracts.
runtime = []
wasm = ["runtime", "dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
# Native XML codecs over the pinned moxml-rs document faces.
xml = ["runtime", "dep:moxml"]

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision", "preserve_order"] }
num-bigint = { version = "=0.4.6", features = ["serde"] }
num-rational = { version = "=0.4.2", features = ["serde", "num-bigint"] }
num-traits = "=0.2.19"
serde_yaml = { version = "=0.9.34", optional = true }
sha2 = { version = "=0.10.8", optional = true }
wasm-bindgen = { version = "=0.2.100", optional = true }
serde-wasm-bindgen = { version = "=0.6.5", optional = true }
unsafe-libyaml = { version = "=0.2.11", optional = true }
moxml = { git = "https://github.com/lutaml/moxml-rs", rev = "c55a7ecf60764d75a7a0ef54f0e483ec40df4b73", optional = true }

[[bin]]
name = "mml-xml-codegen"
path = "src/bin/mml-xml-codegen.rs"
required-features = ["generator", "xml"]
